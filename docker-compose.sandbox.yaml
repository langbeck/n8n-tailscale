services:
  # 1. Generates keys and auto-repairs missing variables
  sandbox-keygen:
    image: alpine:latest
    volumes:
      - sandbox-keys:/keys
    restart: "no"
    command: >
      sh -c "
      apk add --no-cache openssl &&
      if ! grep -q 'SANDBOX_RUNNER_REGISTRATION_TOKEN' /keys/sandbox.env 2>/dev/null; then
        echo 'Missing runner registration token config detected. Generating fresh keys...' &&
        API_KEY=$$(openssl rand -hex 32) &&
        REG_TOKEN=$$(openssl rand -hex 32) &&
        RUNNER_API_KEY=$$(openssl rand -hex 32) &&
        echo export SANDBOX_API_KEYS=$$API_KEY > /keys/sandbox.env &&
        echo export N8N_SANDBOX_SERVICE_API_KEY=$$API_KEY >> /keys/sandbox.env &&
        echo export SANDBOX_API_RUNNER_REGISTRATION_TOKEN=$$REG_TOKEN >> /keys/sandbox.env &&
        echo export SANDBOX_RUNNER_REGISTRATION_TOKEN=$$REG_TOKEN >> /keys/sandbox.env &&
        echo export SANDBOX_API_RUNNER_API_KEY=$$RUNNER_API_KEY >> /keys/sandbox.env &&
        echo export SANDBOX_RUNNER_API_KEYS=$$RUNNER_API_KEY >> /keys/sandbox.env &&
        echo 'Keys updated successfully.';
      else
        echo 'Valid keys already exist in volume. Skipping generation.';
      fi
      "

  # 2. Generates the mutual TLS certificates
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-latest}
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        rm -rf /tls/* &&
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api
    volumes:
      - sandbox-tls:/tls

  # 3. Sandbox API Node
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-latest}
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
      sandbox-keygen:
        condition: service_completed_successfully
    volumes:
      - sandbox-tls:/tls
      - sandbox-keys:/keys
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint: >
      /bin/sh -c "
      . /keys/sandbox.env &&
      exec sandbox-api
      "
    restart: unless-stopped

  # 4. Sandbox Runner Node
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-latest}
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
      sandbox-keygen:
        condition: service_completed_successfully
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-latest}
      # Control-plane mTLS configuration for the runner
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
      - sandbox-keys:/keys
    entrypoint:
      - /bin/sh
      - -c
      - |
        . /keys/sandbox.env
        exec /sbin/tini -- /usr/local/bin/start-runner.sh
    restart: unless-stopped

  # 5. Base n8n Node Extensions
  n8n:
    depends_on:
      sandbox-keygen:
        condition: service_completed_successfully
      sandbox-api:
        condition: service_healthy
    environment:
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: "n8n-sandbox"
      N8N_SANDBOX_SERVICE_URL: "http://sandbox-api:8080"
    volumes:
      - sandbox-keys:/keys
    entrypoint: >
      /bin/sh -c "
      . /keys/sandbox.env &&
      exec tini -- /docker-entrypoint.sh
      "

volumes:
  sandbox-tls:
  sandbox-keys:
